theme = "amberwood"

[editor]
line-number = "relative"
auto-format = false
preview-completion-insert = false
rulers = [80]
color-modes = true
insert-final-newline = false
popup-border = "all"

[editor.statusline]
left = ["mode", "spinner", "file-name", "file-modification-indicator", "read-only-indicator"]
center = ["version-control"]
right = ["total-line-numbers", "file-type", "diagnostics", "position"]
separator = "|"

[editor.cursor-shape]
insert = "bar"
select = "underline"

[editor.whitespace.render]
space = "all"
tab = "all"

[editor.whitespace.characters]
space = "."
tab = "→"
tabpad = "."
